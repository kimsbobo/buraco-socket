# Sticky WebSocket LB for the soak staging cluster (mirrors MULTINODE_RUNBOOK §2).
# ip_hash is the fallback stickiness method; for prod prefer cookie affinity
# (nginx-plus `sticky cookie` or a cookie-issuing LB). Stickiness is now a
# transition aid / latency optimization (PTW-90 rehydration landed), not a
# correctness requirement — but keep it on through the staged rollout.
upstream brazilia_socket {
    ip_hash;
    server node-a:8080 max_fails=3 fail_timeout=10s;
    server node-b:8080 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

server {
    listen 8080;
    server_name _;

    location / {
        proxy_pass http://brazilia_socket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;   # WebSocket upgrade
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_read_timeout  3600s;   # don't cut idle game connections
        proxy_send_timeout  3600s;
        proxy_buffering     off;     # realtime; never buffer frames
    }
}
